services:
  - type: web
    name: reybraztech-scraper
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/.cache/puppeteer npm install --include=dev && PUPPETEER_CACHE_DIR=/opt/render/.cache/puppeteer npx puppeteer browsers install chrome && echo "=== Chrome installed ===" && find /opt/render/.cache/puppeteer -name "chrome" -type f 2>/dev/null | head -5 && rm -rf dist && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
